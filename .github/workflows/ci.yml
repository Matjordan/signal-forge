name: Linux build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev xvfb imagemagick
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format sources and record reproducible dependency snapshot
        run: |
          cargo fmt --all
          cargo generate-lockfile
          python3 - <<'PYTHON'
          import base64, json, pathlib
          files = list(pathlib.Path('src').glob('*.rs')) + list(pathlib.Path('tests').glob('*.rs')) + [pathlib.Path('Cargo.lock')]
          snapshot = json.dumps({str(path): path.read_text() for path in files}).encode()
          print('SOURCE_SNAPSHOT_BEGIN')
          print(base64.b64encode(snapshot).decode())
          print('SOURCE_SNAPSHOT_END')
          PYTHON
      - name: Build desktop application
        run: cargo build --all-targets
      - name: Unit and PTY integration tests
        run: cargo test --all-targets
      - name: Graphical launch with two PTY endpoints
        run: xvfb-run -a -s "-screen 0 1440x900x24" python3 scripts/smoke.py
