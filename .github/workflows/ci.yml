name: Linux build and tests
on:
  workflow_call:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify automatic release versioning
        run: python3 scripts/test-release-version.py
      - name: Set version for this build
        run: python3 scripts/release-version.py --apply
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev xvfb imagemagick xdotool desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Build desktop application
        run: cargo build --locked --all-targets
      - name: Unit and PTY integration tests
        run: cargo test --locked --all-targets
      - name: Graphical launch and real endpoint byte flow
        run: xvfb-run -a -s "-screen 0 2560x1440x24 -noreset" sh -c 'python3 scripts/smoke.py && python3 scripts/workspace-smoke.py && python3 scripts/ui-smoke.py && python3 scripts/update-smoke.py'
      - name: Upload graphical smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-workbench-screenshot
          path: |
            /tmp/signal-forge-smoke.png
            /tmp/workspace-failure.png
            /tmp/signal-forge-four-tiles.png
            /tmp/signal-forge-minimum.png
            /tmp/signal-forge-1440p.png
      - name: Build Linux release package
        run: bash scripts/package-linux.sh
      - name: Verify archive and local installation
        run: |
          cd dist
          sha256sum -c *.sha256
          tar -xzf *.tar.gz
          cd signal-forge-*-linux-x86_64
          bash install.sh "$RUNNER_TEMP/signal-forge-install"
          "$RUNNER_TEMP/signal-forge-install/bin/signal-forge" --help
          expected=${PWD##*/signal-forge-}
          expected=${expected%-linux-x86_64}
          test "$("$RUNNER_TEMP/signal-forge-install/bin/signal-forge" --version)" = "Signal Forge $expected"
          test -f "$RUNNER_TEMP/signal-forge-install/share/applications/signal-forge.desktop"
          test -f "$RUNNER_TEMP/signal-forge-install/share/doc/signal-forge/docs/workbench.jpg"
          test -f "$RUNNER_TEMP/signal-forge-install/share/doc/signal-forge/docs/manual-smoke-test.md"
          python3 "$GITHUB_WORKSPACE/scripts/test-installation.py" "$PWD"
      - uses: actions/upload-artifact@v4
        with:
          name: signal-forge-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
