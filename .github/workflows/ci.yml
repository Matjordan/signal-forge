name: Linux build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev xvfb imagemagick xdotool
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Build desktop application
        run: cargo build --locked --all-targets
      - name: Unit and PTY integration tests
        run: cargo test --locked --all-targets
      - name: Graphical launch and real endpoint byte flow
        run: xvfb-run -a -s "-screen 0 1440x900x24" sh -c 'python3 scripts/smoke.py && python3 scripts/workspace-smoke.py'
      - name: Upload graphical smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-workbench-screenshot
          path: |
            /tmp/signal-forge-smoke.png
            /tmp/workspace-failure.png
      - name: Build Linux release package
        run: bash scripts/package-linux.sh
      - name: Verify archive and local installation
        run: |
          cd dist
          sha256sum -c *.sha256
          tar -xzf *.tar.gz
          cd signal-forge-*-linux-x86_64
          bash install.sh "$RUNNER_TEMP/signal-forge-install"
          "$RUNNER_TEMP/signal-forge-install/bin/signal-forge" --help
          test -f "$RUNNER_TEMP/signal-forge-install/share/applications/signal-forge.desktop"
          test -f "$RUNNER_TEMP/signal-forge-install/share/doc/signal-forge/docs/workbench.jpg"
          test -f "$RUNNER_TEMP/signal-forge-install/share/doc/signal-forge/docs/manual-smoke-test.md"
      - uses: actions/upload-artifact@v4
        with:
          name: signal-forge-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
