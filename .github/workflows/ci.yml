name: Linux build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build desktop application
        run: cargo build --all-targets
      - name: Unit and PTY integration tests
        run: cargo test --all-targets
  design-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the repository design reference for review
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert a_detailed_widescreen_dark_themed_desktop_applicat.png -resize 960x -quality 75 /tmp/signal-forge-reference.jpg
          echo "REFERENCE_IMAGE_BEGIN"
          base64 -w0 /tmp/signal-forge-reference.jpg
          echo
          echo "REFERENCE_IMAGE_END"
